name: Generate README with Gemini

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Gemini Library
        run: pip install google-generativeai

      - name: Read All Files and Generate README
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os
          import google.generativeai as genai

          # ตั้งค่า Gemini API
          genai.configure(api_key=os.environ['GEMINI_API_KEY'])
          
          code_content = ''
          
          # 1. เดินกวาดอ่านทุกไฟล์ในโปรเจกต์
          for root, dirs, files in os.walk('.'):
              # ข้ามโฟลเดอร์ที่ไม่จำเป็น
              dirs[:] = [d for d in dirs if d not in ['.git', '.github', 'venv', '__pycache__', 'node_modules', 'target']]
              
              for file in files:
                  if file.endswith(('.java', '.py', '.js', '.ts', '.html', '.css', '.cpp', '.cs')):
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, 'r', encoding='utf-8') as f:
                              content = f.read()
                              code_content += f'\n\n--- File: {filepath} ---\n{content}'
                      except Exception as e:
                          print(f'Cannot read {filepath}')

          # 2. สร้าง Prompt ส่งให้ AI
          prompt = f'''
          You are an expert developer. I will provide you with the full codebase of my project.
          Please read and understand how the system works, then write a highly professional, detailed README.md file.
          Include sections like Project Title, Description, Tech Stack, Features, Project Structure, and How to Run.
          
          Here is the codebase:
          {code_content[:500000]} 
          
          Output ONLY the Markdown content for the README. Do not include any conversational text.
          '''
          
          print('กำลังส่งเนื้อหาโค้ดให้ Gemini ประมวลผล...')
          
          # เรียกใช้ Gemini 1.5 Flash
          model = genai.GenerativeModel('gemini-1.5-flash')
          response = model.generate_content(prompt)
          
          readme_text = response.text
          
          # คลีนข้อความเล็กน้อยเผื่อ Gemini ครอบ Markdown Block มาให้
          if readme_text.startswith('```markdown'):
              readme_text = readme_text.split('\n', 1)[1]
          if readme_text.startswith('```'):
              readme_text = readme_text.split('\n', 1)[1]
          if readme_text.endswith('```'):
              readme_text = readme_text[:-3]

          # 3. บันทึกผลลัพธ์
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(readme_text.strip())
          
          print('สร้างไฟล์ README.md ด้วย Gemini สำเร็จแล้ว!')
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: Auto-generated README from full codebase via Gemini AI" || echo "No changes to commit"
          git push